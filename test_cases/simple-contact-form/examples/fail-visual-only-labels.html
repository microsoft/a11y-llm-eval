<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail - Visual Only Labels - Contact Form</title>
    <script id="a11y-assertions" type="application/json">{
        "assertions": {
            "Each text input has an accessible name": "fail",
            "Each text input has textbox role": "pass",
            "Helper text is programmatically associated": "fail",
            "Text inputs are keyboard focusable": "pass",
            "Visual labels are defined and persistent": "pass",
            "Visible label is included in accessible name": "fail",
            "Required fields are indicated visually": "pass",
            "Required fields are indicated programmatically": "fail"
        }
    }</script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .form-field {
            margin-bottom: 1.5rem;
        }
        .visual-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #666;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .helper {
            font-size: 0.875rem;
            color: #555;
            margin-top: 0.25rem;
        }
        button[type="submit"] {
            background: #0066cc;
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Contact Us</h1>
        <form>
            <!-- FAIL: Using span instead of label - looks like a label but no programmatic association -->
            <div class="form-field">
                <span class="visual-label">Full Name *</span>
                <input type="text" name="fullname">
            </div>

            <!-- FAIL: Visual label with helper text, but neither is programmatically associated -->
            <div class="form-field">
                <span class="visual-label">Email Address *</span>
                <input type="email" name="email">
                <span class="helper">Format: name@example.com</span>
            </div>

            <!-- FAIL: Div used as label, helper text not associated -->
            <div class="form-field">
                <div class="visual-label">Phone Number</div>
                <input type="tel" name="phone">
                <span class="helper">Format: (555) 123-4567</span>
            </div>

            <div class="form-field">
                <button type="submit">Send Message</button>
            </div>
        </form>
    </main>
</body>
</html>
