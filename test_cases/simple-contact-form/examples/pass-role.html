
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Information - Global Services</title>
    <script id="a11y-assertions" type="application/json">{
        "assertions": {
            "Each text input has an accessible name": "pass",
            "Each text input has textbox role": "pass",
            "Helper text is programmatically associated": "pass",
            "Text inputs are keyboard focusable": "pass",
            "Visual labels are defined and persistent": "pass",
            "Visible label is included in accessible name": "pass"
        }
    }</script>
  <style>
    /* Tokenized Palette for Contrast and Consistency */
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-muted-text: #4d4d4d;
      --color-border: #767676;
      --color-focus: #005a9c;
      --color-error: #b00020;
      --color-button-bg: #1a1a1a;
      --color-button-text: #ffffff;
      --spacing-unit: 1rem;
    }

    /* Basic Reset and Reflow Support */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    .container {
      max-width: 40rem;
      margin: 0 auto;
      padding: var(--spacing-unit);
    }

    /* Skip Link */
    .sr-only:not(:focus):not(:active) {
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    .skip-link {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      background: var(--color-focus);
      color: #fff;
      padding: 0.5rem 1rem;
      z-index: 100;
      text-decoration: none;
      border-radius: 4px;
    }

    /* Typography */
    h1 {
      font-size: 2rem;
      margin-bottom: calc(var(--spacing-unit) * 1.5);
    }

    /* Form Layout */
    .form-field {
      margin-bottom: calc(var(--spacing-unit) * 1.5);
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .required-indicator {
      color: var(--color-error);
      margin-left: 0.25rem;
    }

    .helper-text {
      font-size: 0.875rem;
      color: var(--color-muted-text);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid var(--color-border);
      border-radius: 4px;
      width: 100%;
      max-width: 100%;
    }

    input:focus {
      outline: 3px solid var(--color-focus);
      outline-offset: 2px;
    }

    button {
      background-color: var(--color-button-bg);
      color: var(--color-button-text);
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
    }

    button:focus {
      outline: 3px solid var(--color-focus);
      outline-offset: 2px;
    }

    button:hover {
      background-color: #333;
    }

    /* Error States */
    .field-error {
      color: var(--color-error);
      font-weight: 600;
      margin-top: 0.25rem;
      display: none; /* Controlled via JS */
    }

    input[aria-invalid="true"] {
      border-color: var(--color-error);
    }

    /* Forced Colors Mode */
    @media (forced-colors: active) {
      input, button {
        border: 2px solid ButtonBorder;
      }
      .skip-link, button:focus, input:focus {
        outline: 2px solid Highlight;
      }
    }

    /* Responsive Reflow (320px) */
    @media (max-width: 320px) {
      .container {
        padding: 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <a href="#maincontent" class="skip-link sr-only">Skip to main content</a>

  <header role="banner">
    <div class="container">
      <!-- Site logo or breadcrumbs would go here -->
    </div>
  </header>

  <main id="maincontent" tabindex="-1">
    <div class="container">
      <h1>Contact Information</h1>
      <p>Please fill out the form below. Fields marked with <span aria-hidden="true">*</span> are required.</p>

      <form action="#" method="POST" novalidate id="contact-form">
        
        <div class="form-field">
          <label for="full-name">
            Full Name <span class="required-indicator" aria-hidden="true">*</span>
          </label>
          <input 
            type="text" 
            id="full-name" 
            name="full-name" 
            required 
            aria-required="true"
            autocomplete="name">
          <span id="name-error" class="field-error">Please enter your full name.</span>
        </div>

        <div class="form-field">
          <label for="email-address">
            Email Address <span class="required-indicator" aria-hidden="true">*</span>
          </label>
          <p id="email-helper" class="helper-text">
            Format: example@domain.com
          </p>
          <input 
            type="email" 
            id="email-address" 
            name="email-address" 
            required 
            aria-required="true"
            aria-describedby="email-helper"
            autocomplete="email">
          <span id="email-error" class="field-error">Please enter a valid email address.</span>
        </div>

        <div class="form-field">
          <label for="phone-number">
            Phone Number (Optional)
          </label>
          <p id="phone-helper" class="helper-text">
            Preferred format: 123-456-7890
          </p>
          <input 
            type="tel" 
            id="phone-number" 
            name="phone-number" 
            aria-describedby="phone-helper"
            autocomplete="tel">
        </div>

        <button type="submit">Submit Information</button>

      </form>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="container">
      <p>&copy; 2023 Accessible Form Demo. All rights reserved.</p>
    </div>
  </footer>

  <script>
    /**
     * Simple form validation logic to demonstrate accessible 
     * error management (aria-invalid, aria-describedby, focus management).
     */
    const form = document.getElementById('contact-form');
    
    form.addEventListener('submit', function(event) {
      let firstInvalid = null;

      // Reset states
      const fields = form.querySelectorAll('input[required]');
      fields.forEach(field => {
        const errorMsg = document.getElementById(field.id + '-error');
        field.setAttribute('aria-invalid', 'false');
        if (errorMsg) errorMsg.style.display = 'none';
        
        // Remove error ID from describedby if previously added
        let descriptions = field.getAttribute('aria-describedby') || '';
        descriptions = descriptions.replace(field.id + '-error', '').trim();
        if (descriptions) {
          field.setAttribute('aria-describedby', descriptions);
        } else {
          field.removeAttribute('aria-describedby');
        }
      });

      // Simple Validation Check
      fields.forEach(field => {
        if (!field.value.trim() || (field.type === 'email' && !field.value.includes('@'))) {
          event.preventDefault();
          field.setAttribute('aria-invalid', 'true');
          
          const errorId = field.id + '-error';
          const errorMsg = document.getElementById(errorId);
          if (errorMsg) errorMsg.style.display = 'block';

          // Link error message to input
          let descriptions = field.getAttribute('aria-describedby') || '';
          if (!descriptions.includes(errorId)) {
            field.setAttribute('aria-describedby', (descriptions + ' ' + errorId).trim());
          }

          if (!firstInvalid) firstInvalid = field;
        }
      });

      // Focus the first invalid field
      if (firstInvalid) {
        firstInvalid.focus();
      }
    });
  </script>
</body>
</html>
