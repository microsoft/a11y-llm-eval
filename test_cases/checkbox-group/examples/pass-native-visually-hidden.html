<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native Checkbox Group – Visually Hidden Inputs</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has a valid role": "pass",
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "na",
      "Required fields are indicated visually": "na",
      "Required fields are indicated programmatically": "na",
      "Each checkbox group has an accessible label": "pass",
      "Each checkbox group has a valid role": "pass",
      "Each checkbox is in the tab order": "pass",
      "Space toggles checkbox state of each checkbox": "pass",
      "ARIA attributes match native checkbox attributes if used": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #1a1a2e; color: #e0e0e0; }
    fieldset { border: 1px solid #333; border-radius: 8px; padding: 1rem; }
    legend { font-weight: 600; }

    .option { position: relative; margin: 0.5rem 0; }

    /* Standard accessible pattern: visually hide the native checkbox */
    .option input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* Style the label as the visual control */
    .option label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option label:hover { background: rgba(255,255,255,0.05); }

    /* Custom checkbox indicator */
    .option label .box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 2px solid #666;
      border-radius: 4px;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .option label .box::after {
      content: '';
      display: block;
      width: 10px;
      height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* Checked state */
    .option input[type="checkbox"]:checked + label { border-color: #5b6af0; background: rgba(91,106,240,0.1); }
    .option input[type="checkbox"]:checked + label .box { background: #5b6af0; border-color: #5b6af0; }
    .option input[type="checkbox"]:checked + label .box::after { opacity: 1; }

    /* Focus state */
    .option input[type="checkbox"]:focus-visible + label { outline: 2px solid #5b6af0; outline-offset: 2px; }
  </style>
</head>
<body>
  <form>
    <fieldset>
      <legend>Select your interests</legend>

      <div class="option">
        <input id="int-music" type="checkbox" name="interests" value="music" />
        <label for="int-music"><span class="box"></span> Music</label>
      </div>

      <div class="option">
        <input id="int-art" type="checkbox" name="interests" value="art" />
        <label for="int-art"><span class="box"></span> Art</label>
      </div>

      <div class="option">
        <input id="int-science" type="checkbox" name="interests" value="science" />
        <label for="int-science"><span class="box"></span> Science</label>
      </div>
    </fieldset>
  </form>
</body>
</html>
