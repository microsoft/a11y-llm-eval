<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkbox Group Missing Visual Required Indicator</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Required fields are indicated visually": "fail",
      "Required fields are indicated programmatically": "pass",
      "Each checkbox group has an accessible label": "pass",
      "Each checkbox is in the tab order": "pass",
      "Space toggles checkbox state of each checkbox": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <fieldset>
      <legend>Select Preferred Updates</legend>
      <div class="form-field">
        <input id="visual-required-email" type="checkbox" required checked />
        <label for="visual-required-email">Email</label>
      </div>
      <div class="form-field">
        <input id="visual-required-sms" type="checkbox" />
        <label for="visual-required-sms">SMS</label>
      </div>
      <button type="submit">Continue</button>
    </fieldset>
  </form>
</body>
</html>
