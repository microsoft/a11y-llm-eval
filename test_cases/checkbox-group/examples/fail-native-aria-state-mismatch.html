<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native Checkbox ARIA State Mismatch</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Required fields are indicated visually": "pass",
      "Required fields are indicated programmatically": "fail",
      "Each checkbox group has an accessible label": "pass",
      "Each checkbox is in the tab order": "pass",
      "Space toggles checkbox state of each checkbox": "pass",
      "ARIA attributes match native checkbox attributes if used": "fail",
      "Checked state is programmatically exposed": "fail"
    }
  }</script>
</head>
<body>
  <form>
    <fieldset>
      <legend>Select Delivery Methods (required)</legend>
      <div class="form-field">
        <input id="mismatch-email" type="checkbox" checked required aria-checked="false" aria-required="false" />
        <label for="mismatch-email">Email</label>
      </div>
      <div class="form-field">
        <input id="mismatch-sms" type="checkbox" disabled aria-disabled="false" />
        <label for="mismatch-sms">SMS</label>
      </div>
      <button type="submit">Continue</button>
    </fieldset>
  </form>
</body>
</html>
