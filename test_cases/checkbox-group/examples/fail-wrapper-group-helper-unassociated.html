<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Languages Quiz</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "fail",
      "Required fields are indicated visually": "na",
      "Required fields are indicated programmatically": "na",
      "Each checkbox group has an accessible label": "fail",
      "Each checkbox group has a valid role": "fail",
      "Each checkbox is in the tab order": "pass",
      "Space toggles checkbox state of each checkbox": "pass",
      "ARIA attributes match native checkbox attributes if used": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a31;
      --panel-2: #0f172a;
      --border: rgba(255, 255, 255, 0.10);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #7c3aed;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 30%),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 26%),
        linear-gradient(180deg, #070b15 0%, #0b1020 45%, #090d18 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    #root {
      width: 100%;
      max-width: 860px;
    }

    .app-shell {
      background: rgba(18, 26, 49, 0.82);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .hero {
      padding: 32px 32px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.10), rgba(18, 26, 49, 0));
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      color: #c4b5fd;
      margin: 0 0 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      max-width: 65ch;
      line-height: 1.6;
    }

    form {
      padding: 28px 32px 32px;
    }

    .form-field {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .question-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .question-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
    }

    .help-text {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    label.choice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    label.choice:hover {
      transform: translateY(-1px);
      border-color: rgba(124, 58, 237, 0.45);
      background: rgba(18, 26, 49, 0.95);
    }

    input[type="checkbox"] {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .choice-text {
      display: block;
      line-height: 1.45;
      color: var(--text);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
    }

    button.submit-btn {
      appearance: none;
      border: 0;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 14px 20px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button.submit-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .result {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(34, 197, 94, 0.10);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #d1fae5;
      display: none;
    }

    .result.show {
      display: block;
    }

    @media (max-width: 640px) {
      .hero, form {
        padding-left: 18px;
        padding-right: 18px;
      }

      .form-field {
        padding: 18px;
      }

      .actions {
        justify-content: stretch;
      }

      .submit-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script>
    const e = React.createElement;

    function Question({ title, helpText, options, name }) {
      return e(
        'div',
        { className: 'form-field' },
        e(
          'div',
          { className: 'question-header' },
          e('h2', { className: 'question-title' }, title),
          helpText ? e('p', { className: 'help-text' }, helpText) : null
        ),
        e(
          'div',
          { className: 'choices' },
          options.map((option, index) =>
            e(
              'label',
              { className: 'choice', key: index },
              e('input', {
                type: 'checkbox',
                name: name,
                value: option
              }),
              e('span', { className: 'choice-text' }, option)
            )
          )
        )
      );
    }

    function QuizApp() {
      const [submitted, setSubmitted] = React.useState(false);

      function handleSubmit(event) {
        event.preventDefault();
        setSubmitted(true);
      }

      return e(
        'div',
        { className: 'app-shell' },
        e(
          'div',
          { className: 'hero' },
          e('p', { className: 'eyebrow' }, 'Knowledge Check'),
          e('h1', null, 'Computer Languages Quiz'),
          e(
            'p',
            { className: 'subtitle' },
            'Select all answers you think apply to each question. Some questions may have more than one correct answer.'
          )
        ),
        e(
          'form',
          { onSubmit: handleSubmit },
          e(Question, {
            title: '1. Which of these are programming languages?',
            helpText: 'Choose every item that is a computer programming language.',
            name: 'q1',
            options: ['Python', 'HTML', 'JavaScript', 'CSS']
          }),
          e(Question, {
            title: '2. Which languages are commonly used for web development?',
            name: 'q2',
            options: ['JavaScript', 'TypeScript', 'Kotlin', 'HTML']
          }),
          e(Question, {
            title: '3. Which of these are considered low-level or systems-oriented languages?',
            name: 'q3',
            options: ['C', 'Assembly', 'Ruby', 'Rust']
          }),
          e(
            'div',
            { className: 'actions' },
            e('button', { type: 'submit', className: 'submit-btn' }, 'Submit Quiz')
          ),
          e(
            'div',
            { className: 'result' + (submitted ? ' show' : '') },
            'Quiz submitted. Review your selections.'
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(QuizApp));
  </script>
</body>
</html>
