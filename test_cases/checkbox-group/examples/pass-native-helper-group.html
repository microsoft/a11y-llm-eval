<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native Checkbox Group With Associated Helper</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "pass",
      "Required fields are indicated visually": "na",
      "Required fields are indicated programmatically": "na",
      "Each checkbox group has an accessible label": "pass",
      "Each checkbox is in the tab order": "pass",
      "Space toggles checkbox state of each checkbox": "pass",
      "ARIA attributes match native checkbox attributes if used": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <div class="form-field">
      <fieldset aria-describedby="contact-help">
        <legend>Select Contact Preferences</legend>
        <p id="contact-help">Choose every method you are comfortable using.</p>
        <div><input id="pref-email" type="checkbox" name="contact" checked /><label for="pref-email">Email</label></div>
        <div><input id="pref-sms" type="checkbox" name="contact" /><label for="pref-sms">SMS</label></div>
        <div><input id="pref-phone" type="checkbox" name="contact" /><label for="pref-phone">Phone</label></div>
      </fieldset>
    </div>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
