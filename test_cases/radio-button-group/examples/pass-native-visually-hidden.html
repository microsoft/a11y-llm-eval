<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native Radio Group – Visually Hidden Inputs</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each radio has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "na",
      "Required fields are indicated visually": "na",
      "Required fields are indicated programmatically": "na",
      "Each radio group has an accessible label": "pass",
      "Each radio group is keyboard reachable": "pass",
      "Arrow keys change the selected radio within each group": "pass",
      "ARIA attributes match native radio attributes if used": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #1a1a2e; color: #e0e0e0; }
    fieldset { border: 1px solid #333; border-radius: 8px; padding: 1rem; }
    legend { font-weight: 600; }

    .option { position: relative; margin: 0.5rem 0; }

    /* Standard accessible pattern: visually hide the native radio */
    .option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* Style the label as the visual control */
    .option label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option label:hover { background: rgba(255,255,255,0.05); }

    /* Custom radio indicator */
    .option label .dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 2px solid #666;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .option label .dot::after {
      content: '';
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.15s;
    }

    /* Checked state */
    .option input[type="radio"]:checked + label { border-color: #5b6af0; background: rgba(91,106,240,0.1); }
    .option input[type="radio"]:checked + label .dot { border-color: #5b6af0; }
    .option input[type="radio"]:checked + label .dot::after { background: #5b6af0; }

    /* Focus state */
    .option input[type="radio"]:focus-visible + label { outline: 2px solid #5b6af0; outline-offset: 2px; }
  </style>
</head>
<body>
  <form>
    <fieldset>
      <legend>Preferred Contact Method</legend>

      <div class="option">
        <input id="contact-email" type="radio" name="contact-method" value="email" checked />
        <label for="contact-email"><span class="dot"></span> Email</label>
      </div>

      <div class="option">
        <input id="contact-phone" type="radio" name="contact-method" value="phone" />
        <label for="contact-phone"><span class="dot"></span> Phone</label>
      </div>

      <div class="option">
        <input id="contact-text" type="radio" name="contact-method" value="text" />
        <label for="contact-text"><span class="dot"></span> Text Message</label>
      </div>
    </fieldset>
    <div style="margin-top: 1rem;">
      <button type="submit">Continue</button>
    </div>
  </form>
</body>
</html>
