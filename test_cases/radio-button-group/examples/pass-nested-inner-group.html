<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Group – Nested Inner Group Wrapper</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each radio has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "na",
      "Required fields are indicated visually": "na",
      "Required fields are indicated programmatically": "na",
      "Each radio group has an accessible label": "pass",
      "Each radio group is keyboard reachable": "pass",
      "Arrow keys change the selected radio within each group": "pass",
      "ARIA attributes match native radio attributes if used": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <!--
      Outer role="radiogroup" is properly labeled via aria-labelledby.
      Inner role="group" on .options is a decorative wrapper with no name.
      The test should resolve radios to the labeled outer radiogroup.
    -->
    <div role="radiogroup" aria-labelledby="q1-label">
      <p id="q1-label">Preferred contact method</p>
      <div class="options" role="group">
        <label><input type="radio" name="contact" value="email" checked /> Email</label>
        <label><input type="radio" name="contact" value="phone" /> Phone</label>
        <label><input type="radio" name="contact" value="text" /> Text Message</label>
      </div>
    </div>
  </form>
</body>
</html>
