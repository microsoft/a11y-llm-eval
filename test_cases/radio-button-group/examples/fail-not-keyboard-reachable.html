<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Group Not Keyboard Reachable</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each radio has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",

      "Required fields are indicated (visually and programmatically)": "pass",
      "Each radio group is keyboard reachable": "fail",
      "Arrow keys change the selected radio within each group": "fail",
      "Checked state is programmatically exposed": "fail"
    }
  }</script>
  <style>
    [role="radio"] {
      border: 1px solid #333;
      display: inline-block;

      padding: 0.5rem 0.75rem;
    }

</head>
<body>
  <h1 id="unreachable-heading">Preferred Contact Method</h1>
  <div role="radiogroup" aria-labelledby="unreachable-heading">
    <div class="form-field"><div role="radio" tabindex="-1">Email</div></div>
    <div class="form-field"><div role="radio" tabindex="-1">Phone</div></div>
    <div class="form-field"><div role="radio" tabindex="-1">Text Message</div></div>
  </div>
