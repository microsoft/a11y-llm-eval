<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invalid Required Fieldset</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each radio has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "na",
      "Required fields are indicated (visually and programmatically)": "fail",
      "Each radio group has an accessible label": "pass",
      "Each radio group is keyboard reachable": "pass",
      "Arrow keys change the selected radio within each group": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <fieldset aria-required="true">
      <legend>Preferred Contact Method (required)</legend>
      <div class="form-field">
        <input id="fieldset-required-email" type="radio" name="contact-method" value="email" checked />
        <label for="fieldset-required-email">Email</label>
      </div>
      <div class="form-field">
        <input id="fieldset-required-phone" type="radio" name="contact-method" value="phone" />
        <label for="fieldset-required-phone">Phone</label>
      </div>
      <div class="form-field">
        <input id="fieldset-required-text" type="radio" name="contact-method" value="text" />
        <label for="fieldset-required-text">Text Message</label>
      </div>
      <button type="submit">Continue</button>
    </fieldset>
  </form>
</body>
</html>
