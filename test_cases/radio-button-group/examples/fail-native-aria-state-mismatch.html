<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Native Radio ARIA State Mismatch</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each radio has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "na",
      "Required fields are indicated visually": "pass",
      "Required fields are indicated programmatically": "fail",
      "Each radio group has an accessible label": "pass",
      "Each radio group is keyboard reachable": "pass",
      "Arrow keys change the selected radio within each group": "pass",
      "ARIA attributes match native radio attributes if used": "fail",
      "Checked state is programmatically exposed": "fail"
    }
  }</script>
</head>
<body>
  <form>
    <fieldset>
      <legend>Preferred Contact Method (required)</legend>
      <div class="form-field">
        <input id="mismatch-email" type="radio" name="contact-method" value="email" checked required aria-checked="false" aria-required="false" />
        <label for="mismatch-email">Email</label>
      </div>
      <div class="form-field">
        <input id="mismatch-phone" type="radio" name="contact-method" value="phone" />
        <label for="mismatch-phone">Phone</label>
      </div>
      <div class="form-field">
        <input id="mismatch-text" type="radio" name="contact-method" value="text" disabled aria-disabled="false" />
        <label for="mismatch-text">Text Message</label>
      </div>
      <button type="submit">Continue</button>
    </fieldset>
  </form>
</body>
</html>
