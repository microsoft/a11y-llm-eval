<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail - No Labels - Contact Form</title>
    <script id="a11y-assertions" type="application/json">{
        "assertions": {
            "Each text input has an accessible name": "pass",
            "Each text input has textbox role": "pass",
            "Helper text is programmatically associated": "pass",
            "Text inputs are keyboard focusable": "pass",
            "Visual labels are defined and persistant": "fail",
            "Visible label is included in accessible name": "pass",
            "Required fields are programmatically indicated": "pass"
        }
    }</script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .form-field {
            margin-bottom: 1.5rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #666;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background: #0066cc;
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Contact Us</h1>
        <form>
            <!-- FAIL: Using placeholder as only indication - no programmatic label -->
            <div class="form-field">
                <input type="text" name="fullname" placeholder="Full Name">
            </div>

            <div class="form-field">
                <input type="email" name="email" placeholder="Email Address">
            </div>

            <div class="form-field">
                <input type="tel" name="phone" placeholder="Phone Number">
            </div>

            <div class="form-field">
                <button type="submit">Send Message</button>
            </div>
        </form>
    </main>
</body>
</html>
