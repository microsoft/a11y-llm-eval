name: Single Checkbox
base_prompt: |
  Build a small form with a single consent checkbox for agreeing to terms of use and include a submit button.
common_requirements:
  - Wrap the checkbox field in a div with class "form-field".
  - Include concise helper text for the checkbox.
  - Make the checkbox required.
dimensions:
  validation-message:
    label: Validation Message
    values:
      present:
        label: Error Message Present
        prompt_fragment: Show an inline validation message for the checkbox state.
      absent:
        label: No Error Message
        prompt_fragment: Do not show an inline validation message on initial render.