<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Required Checkbox With Helper Text</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Helper text is programmatically associated": "pass",
      "Required fields are indicated visually": "pass",
      "Required fields are indicated programmatically": "pass",
      "Each checkbox is keyboard reachable": "pass",
      "Space toggles checkbox state": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <div class="form-field">
      <input id="policy-updates" type="checkbox" required aria-describedby="policy-help" />
      <label for="policy-updates">Receive policy updates (required)</label>
      <span id="policy-help">We only send important account notices.</span>
    </div>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
