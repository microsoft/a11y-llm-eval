<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkbox Missing Visual Required Indicator</title>
  <script id="a11y-assertions" type="application/json">{
    "assertions": {
      "Each checkbox has an accessible name": "pass",
      "Visible label is included in accessible name": "pass",
      "Visual labels are defined and persistent": "pass",
      "Required fields are indicated visually": "fail",
      "Required fields are indicated programmatically": "pass",
      "Each checkbox is keyboard reachable": "pass",
      "Space toggles checkbox state": "pass",
      "Checked state is programmatically exposed": "pass"
    }
  }</script>
</head>
<body>
  <form>
    <div class="form-field">
      <input id="privacy-ack" type="checkbox" required checked />
      <label for="privacy-ack">I acknowledge the privacy policy</label>
    </div>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
