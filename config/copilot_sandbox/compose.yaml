# docker compose file for the GitHub Copilot CLI sandbox.
#
# The harness brings this up with `docker compose -f config/copilot_sandbox/compose.yaml up -d`
# at the start of a `run` and leaves it warm afterwards. The container is
# kept alive by the Dockerfile's `tail -f /dev/null` PID 1; sessions are
# opened lazily through `docker exec -i <container> copilot ...`.
#
# The container name is derived from COPILOT_CONTAINER_NAME (set by the
# harness from a hash of the workspace path) so two harness instances on
# the same Docker host don't collide.

services:
  copilot:
    build:
      context: .
      args:
        UID: ${COPILOT_UID:-1000}
        GID: ${COPILOT_GID:-1000}
        COPILOT_CLI_VERSION: ${COPILOT_CLI_VERSION:-latest}
    image: a11y-eval/copilot-sandbox:latest
    container_name: ${COPILOT_CONTAINER_NAME:-a11y-copilot-sandbox}
    init: true
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      # Named volume for in-container Copilot auth. The CLI does its own
      # device-code login on first use; the token persists across
      # container rebuilds without exposing the host's ~/.copilot.
      - copilot-auth:/copilot/.copilot
      # The harness workspace, so skills referenced by absolute host
      # paths can be translated to /workspace/<rel>. RW because skills
      # and agent tools may write files; the harness reads back
      # index.html from per-sample sandbox directories.
      - "${COPILOT_WORKSPACE:-../..}:/workspace"
    environment:
      HOME: /copilot
      XDG_CONFIG_HOME: /copilot/.config
      # BYOK provider keys are forwarded per `docker exec -e` by the
      # wrapper script (scripts/copilot-docker.sh). They are NOT set as
      # static container env. GH_TOKEN / GITHUB_TOKEN flow the same way
      # as a CI/headless fallback for auth.
      # Enable the Copilot CLI's SKILLS_INSTRUCTIONS feature flag inside
      # the container. With this on, the CLI's `skill` tool description
      # uses the stronger "BLOCKING REQUIREMENT" phrasing, which makes
      # the model far more likely to invoke a skill autonomously when
      # its frontmatter description matches the task. This flag is
      # currently `staff`-gated upstream; we enable it here so the
      # skill benchmark measures the mechanism's intended behavior.
      COPILOT_CLI_ENABLED_FEATURE_FLAGS: ${COPILOT_CLI_ENABLED_FEATURE_FLAGS:-SKILLS_INSTRUCTIONS}
      SKILLS_INSTRUCTIONS: ${SKILLS_INSTRUCTIONS:-true}

volumes:
  copilot-auth:
