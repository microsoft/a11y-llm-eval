# Default instruction sets for benchmarking (vs control).
# Use with:
#   python -m a11y_llm_tests.cli run --instruction-sets-file config/default_instruction_sets.yaml ...

instruction_sets:
  - id: accessible_minimal
    name: 0. Minimal
    description: Minimal reminder that all output must be accessible.
    instructions_markdown: instructions/accessible-minimal.md
    # Optional override. If omitted, defaults to the same value as --samples.
    # samples: 5
  - id: accessible_basic
    name: 1. Basic
    description: Basic reminder that all output must be accessible (includes slightly more instructions than minimal).
    instructions_markdown: instructions/accessible-basic.md
    # Optional override. If omitted, defaults to the same value as --samples.
    # samples: 5
